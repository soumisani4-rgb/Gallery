<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Cinematic Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="header">
    <div class="mini-title">CINEMATIC 3D GALLERY</div>

    <h1>GALLERY</h1>

    <p>EXPLORE THE COLLECTION</p>
  </header>


  <!-- 3D GALLERY -->

  <main class="scene">

    <div class="gallery" id="gallery">

      <div class="card card1">
        <img src="images/img1.jpg" alt="Photo 1">
      </div>

      <div class="card card2">
        <img src="images/img2.jpg" alt="Photo 2">
      </div>

      <div class="card card3">
        <img src="images/img3.jpg" alt="Photo 3">
      </div>

      <div class="card card4">
        <img src="images/img4.jpg" alt="Photo 4">
      </div>

      <div class="card card5">
        <img src="images/img5.jpg" alt="Photo 5">
      </div>

      <div class="card card6">
        <img src="images/img6.jpg" alt="Photo 6">
      </div>

    </div>

  </main>


  <!-- CONTROLS -->

  <div class="controls">

    <button id="leftBtn">‹</button>

    <span>DRAG TO EXPLORE</span>

    <button id="rightBtn">›</button>

  </div>


  <!-- FULLSCREEN TRANSITION -->

  <div class="viewer" id="viewer">

    <div class="viewer-image-wrapper" id="viewerWrapper">

      <img
        id="viewerImage"
        src=""
        alt="Full Screen"
      >

    </div>

    <button
      class="viewer-close"
      id="closeViewer"
    >
      ×
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
